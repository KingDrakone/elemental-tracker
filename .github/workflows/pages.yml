# Publica a página (elementais-tracker/pagina.html) no GitHub Pages sempre que ela muda.
# Ativar uma vez: Settings -> Pages -> Source: "GitHub Actions".
name: Publicar página
on:
  push:
    branches: [main]
    paths: ["elementais-tracker/pagina.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp elementais-tracker/pagina.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
