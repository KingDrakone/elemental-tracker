:root{
  --bg:#0f1b24;--ink:#efe2c4;--muted:#b8b0a0;--title:#f0c057;--card:#f2e6c9;--cink:#2a1c0f;--cmuted:#6b5a44;
  --line:#d8c59c;--track:#e4d3ad;--gold:#c9a24f;--brown:#7a4a1e;--hero:#fbecc4;--good:#3a9a5b;--warn:#a3361f;
  --slot-locked:#e4d3ad;--vn:#b4bfe0;--vf:#f3b261;--va:#8fd49a;
  --r-raro:#2f6fe0;--r-epico:#9040d8;--r-lendario:#c9780a;--r-mitico:#d63b3b;
  --pirate:"Pirata One","Segoe UI",serif;--body:"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#efe4c9;--ink:#2a1c0f;--muted:#6b5a44;--title:#7a4a1e;--card:#fffaf0;--line:#e2d2ae;--track:#efe2c4;--slot-locked:#efe2c4;color-scheme:light}}
:root[data-theme="light"]{--bg:#efe4c9;--ink:#2a1c0f;--muted:#6b5a44;--title:#7a4a1e;--card:#fffaf0;--line:#e2d2ae;--track:#efe2c4;--slot-locked:#efe2c4;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0;
  padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.pirate{font-family:var(--pirate);font-weight:400}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-direction:column;gap:16px}
header.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
h1.app{margin:0;font-size:38px;line-height:1;color:var(--title)}
.who{color:var(--muted);font-size:14px}
.pf{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pf[hidden],#pfform[hidden]{display:none}
#pfform{display:flex;gap:6px;align-items:center}
.sel{font:600 14px var(--body);min-height:40px;border:1px solid var(--gold);border-radius:8px;background:var(--card);color:var(--cink);padding:6px 10px;max-width:180px}
.ibtn.sm{min-height:40px;padding:6px 12px;font-size:16px}
#pfname{min-width:0;width:150px;flex:none}
.right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.codebtn{font:600 13px var(--body);cursor:pointer;border:1px solid var(--gold);border-radius:999px;background:transparent;color:var(--ink);padding:6px 12px;letter-spacing:.04em}
.codebtn b{color:var(--title);font-weight:800;letter-spacing:.1em}
.codebtn:hover{background:rgba(201,162,79,.18)}
.codebtn:focus-visible{outline:3px solid #ffd36a;outline-offset:2px}
.sync{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);color:var(--cink);font-weight:600;font-size:14px}
.sync i{width:10px;height:10px;border-radius:50%;background:#c8412f;display:inline-block}
.sync.on i{background:var(--good)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--ink);
  font:600 15px var(--body);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab b{font-weight:700;font-size:.72rem;padding:1px 8px;border-radius:99px;background:rgba(201,162,79,.25);color:inherit}
.tab.on{background:var(--gold);color:var(--cink)}
.tab.on b{background:rgba(42,28,15,.18)}

.hero{position:relative;background:var(--brown);color:var(--hero);border:2px solid #e7b440;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hero .l{font-size:13px;color:var(--hero)}
.count{font-size:54px;font-weight:700;line-height:1.05;color:#ffd36a;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.28);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:#ffd36a;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.panel{background:var(--card);color:var(--cink);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bar-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;min-height:40px;font:15px var(--body);color:var(--cink);background:#fffaf0;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.search::placeholder{color:var(--cmuted)}
.seg{display:flex;gap:4px;padding:3px;border:1px solid var(--gold);border-radius:8px}
.seg button,.ibtn{font:600 14px var(--body);cursor:pointer;border:0;border-radius:6px;background:transparent;color:var(--cink);padding:7px 12px;min-height:32px}
.seg button.on{background:var(--brown);color:var(--hero)}
.ibtn{border:1px solid var(--gold);border-radius:8px;padding:8px 14px;min-height:40px;background:var(--card);white-space:nowrap}
.ibtn:hover,.seg button:hover:not(.on){background:var(--track)}
.ibtn.active{background:var(--brown);color:var(--hero);border-color:#e7b440}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button.btn{font:600 14px var(--body);min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--gold);background:var(--card);color:var(--cink);cursor:pointer}
button.btn:hover{background:var(--track)}
button.btn.main{background:var(--brown);color:var(--hero);border-color:#e7b440}
button.btn.ghost{background:var(--card)}
button.btn.small{min-height:0;padding:4px 10px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
button.btn:disabled{opacity:.45;cursor:default}
button.btn:focus-visible,.var:focus-visible,.seg button:focus-visible,.ibtn:focus-visible,.tab:focus-visible{outline:3px solid #ffd36a;outline-offset:2px}

section.rar{display:flex;flex-direction:column;gap:12px}
section.rar>h2{
  margin:0;font-family:var(--pirate);font-weight:400;font-size:26px;line-height:1.1;
  color:color-mix(in srgb,var(--rc) 55%,#fff);display:flex;align-items:center;gap:10px
}
:root[data-theme="light"] section.rar>h2{color:var(--rc)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) section.rar>h2{color:var(--rc)}}
section.rar>h2 small{font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{
  background:var(--card);color:var(--cink);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;
  border:1px solid var(--line);border-top:3px solid var(--rc);
}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:none}
.card-h h3{margin:0;font-weight:700;font-size:1rem;min-width:0;overflow-wrap:anywhere;flex:1}
.pill{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--rc);color:#fff;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0}
.tg{font:600 .68rem var(--body);cursor:pointer;border:1px solid var(--gold);border-radius:999px;background:transparent;color:var(--cmuted);padding:1px 8px}
.tg:hover{background:var(--track);color:var(--cink)}
.tg:focus-visible{outline:3px solid #ffd36a;outline-offset:2px}
.vars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;align-items:start}
.var{
  position:relative;border:0;border-radius:8px;padding:6px 4px 4px;cursor:pointer;color:var(--cink);font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--slot-locked);
  transition:transform .15s ease;min-width:0
}
.var:hover{transform:translateY(-2px)}
.num{position:absolute;top:24px;left:7px;z-index:1;font-family:var(--pirate);font-size:.8rem;line-height:1;padding:2px 5px;border-radius:5px;background:var(--rc);color:#fff}
.var[data-v="0"].on{background:var(--vn)}
.var[data-v="1"].on{background:var(--vf)}
.var[data-v="2"].on{background:var(--va)}
.var .lab{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var img{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:6px}
.var .st{font-size:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:0;color:var(--cmuted);white-space:nowrap}
.var.on .st{color:var(--cink);opacity:.8}
.var.fresh{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cmuted)}
.card-f .ok{color:#1d7a3c}
.card-f .n{font-variant-numeric:tabular-nums;color:var(--cink);margin-left:6px}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);
  background:var(--card);color:var(--cink);border:2px solid var(--gold);padding:10px 16px;border-radius:8px;font-weight:600;

        if(novoR)toast(tr('syncOn'));
      }else{
        var novos=remote.filter(function(i){return !has(i)}),perdidos=owned.filter(function(i){return remote.indexOf(i)<0});
        if(novos.length||perdidos.length){
          owned=remote;saveLocal();render(novos.length?novos[novos.length-1]:undefined);
          if(novos.length)toast(tr('fromPc')+nome(novos[novos.length-1])+'!');
        }
      }
      done();
    }).catch(function(){setSync(false);SYNC.first=true;done();});
  }catch(e){setSync(false);done();}
}
/* ---- contas (perfis) ---- */
function pfName(p){return p.nome||tr('pfMain')}
function pfList(){return SYNC.on?SYNC.lista:LP.lista}
function pfActive(){return SYNC.on?SYNC.perfil:LP.ativo}
function pfRender(){
  var s=document.getElementById('perfil');if(!s)return;
  var l=pfList(),a=pfActive();
  s.innerHTML=l.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===a?' selected':'')+'>'+esc(pfName(p))+'</option>';}).join('');
  s.setAttribute('aria-label',tr('pfAcc'));
}
function pfFetch(){
  fetch(PAPI,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var j=JSON.stringify(d.lista);if(j!==SYNC.lj){SYNC.lj=j;SYNC.lista=d.lista||[];}
    pfRender();
  }).catch(function(){});
}
function pfSave(){try{localStorage.setItem(PKEY,JSON.stringify(LP))}catch(e){}}
function pfPost(o,then){
  try{fetch(PAPI,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).then(function(){SYNC.hold=0;if(then)then();pfFetch();}).catch(function(){setSync(false)});}catch(e){}
}
function pfSwitch(id){
  if(SYNC.on){pfPost({acao:'trocar',id:id},function(){SYNC.hold=0;});return;}
  if(id===LP.ativo)return;
  saveLocal();LP.ativo=id;pfSave();KEY=keyFor(id);owned=load();render();pfRender();
  var p=LP.lista.filter(function(x){return x.id===id})[0];toast(tr('pfNone')+pfName(p));
}
function pfForm(mode){
  var f=document.getElementById('pfform'),i=document.getElementById('pfname');
  PF.mode=mode;f.hidden=false;i.placeholder=tr('pfName');
  var cur=pfList().filter(function(x){return x.id===pfActive()})[0];
  i.value=mode==='edit'&&cur?(cur.nome||''):'';i.focus();
}
var PF={mode:'new'};
function pfSubmit(){
  var f=document.getElementById('pfform'),n=document.getElementById('pfname').value.trim().slice(0,24);
  f.hidden=true;if(!n&&PF.mode==='edit')return;
  if(SYNC.on){
    if(PF.mode==='new')pfPost({acao:'novo',nome:n});else pfPost({acao:'renomear',id:SYNC.perfil,nome:n});
    return;
  }
  if(PF.mode==='new'){
    saveLocal();var k=1;while(LP.lista.some(function(p){return p.id==='p'+k}))k++;
    var id='p'+k;LP.lista.push({id:id,nome:n||(tr('pfAcc')+' '+(LP.lista.length+1))});LP.ativo=id;pfSave();KEY=keyFor(id);owned=[];saveLocal();render();pfRender();toast(tr('pfNone')+LP.lista[LP.lista.length-1].nome);
  }else{
    LP.lista.forEach(function(p){if(p.id===LP.ativo)p.nome=n});pfSave();pfRender();
  }
}
function has(i){return owned.indexOf(i)>-1}
function nome(i){var f=INFO[i];return f?gname(f.g)+' ('+VN[f.k]+')':tr('elem')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

/* Busca por nome ou por tags: raridade, variante, número (#5), estado (encontrado / falta / completo). Vários termos = todos têm de bater. */
function matchQ(g,r){
  var got=0;g.v.forEach(function(i){if(has(i))got++;});
  var tags=[g.n,g.e||'',r.n,TX.en.rn[r.k],r.k];
  g.v.forEach(function(i,k){tags.push(TX.pt.vn[k],TX.en.vn[k]);if(NUM[i])tags.push('#'+NUM[i]);});
  if(got>0)tags.push('encontrado','found');
  if(got<g.v.length)tags.push('falta','missing','pendente');
  if(got===g.v.length)tags.push('completo','complete');
  [g.n,g.e||''].forEach(function(x){tags.push(x.replace(/[^A-Za-z0-9]+/g,''))});
  var nt=tags.map(norm),terms=norm(ST.q).replace(/^tag:|\s+tag:/g,' ').split(/\s+/).filter(Boolean);
  return terms.every(function(w){
    if(w.charAt(0)==='#')return nt.indexOf(w)>-1;
    return nt.some(function(x){return x.charAt(0)!=='#'&&x.indexOf(w)>-1;});
  });
}
/* Tags próprias de cada elemental (clicar numa tag põe-na na busca) */
function tagsHtml(g,r,n){
  var en=L==='en',st=n===g.v.length?(en?'complete':'completo'):n>0?(en?'found':'encontrado'):(en?'missing':'falta');
  var nm=gname(g).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
  return '<div class="tags">'+[[nm,nm],[rn(r).toLowerCase(),rn(r)],[st,st]].map(function(x){
    return '<button type="button" class="tg" data-q="'+esc(x[0])+'">#'+esc(x[1].toLowerCase())+'</button>';}).join('')+'</div>';
}
function render(fresh){
  var list=document.getElementById('list');list.innerHTML='';
  var shown=0;
  RARS.forEach(function(r){
    if(ST.tab!=='todos'&&ST.tab!==r.k)return;
    var gs=r.g.filter(function(g){
      if(ST.q&&!matchQ(g,r))return false;
      var n=0;g.v.forEach(function(i){if(has(i))n++;});
      if(ST.status===1&&n===0)return false;
      if(ST.status===2&&n===g.v.length)return false;
      return true;});
    if(!gs.length)return;shown+=gs.length;
    var sec=document.createElement('section');sec.className='rar';sec.style.setProperty('--rc','var('+r.c+')');
    var tot=0,got=0;
    r.g.forEach(function(g){g.v.forEach(function(i){tot++;if(has(i))got++;});});
    sec.innerHTML='<h2>'+rn(r)+' <small>'+got+'/'+tot+'</small></h2>';
    var cards=document.createElement('div');cards.className='cards'+(ST.view==='list'?' rows':'');
    gs.forEach(function(g){
      var c=document.createElement('div');c.className='card';
      var n=0;g.v.forEach(function(i){if(has(i))n++;});
      var h='<div class="card-h"><span class="dot"></span><h3>'+esc(gname(g))+'</h3><span class="pill">'+rn(r)+'</span></div>'+tagsHtml(g,r,n)+'<div class="vars">';
      g.v.forEach(function(i,k){
        var on=has(i);
        h+='<button type="button" class="var'+(on?' on':'')+(i===fresh?' fresh':'')+'" id="slot'+i+'" data-i="'+i+'" data-v="'+k+'" aria-pressed="'+on+'" aria-label="'+esc(gname(g)+', '+VN[k]+(on?tr('fndL'):tr('nfndL')))+'">'+
          (NUM[i]?'<span class="num">#'+NUM[i]+'</span>':'')+'<span class="lab">'+VN[k]+'</span><img alt="" src="'+(on?IMGS[i]:SILS[i])+'"><span class="st">'+(on?tr('fnd'):tr('nfnd'))+'</span></button>';
      });
      h+='</div><div class="card-f"><span class="'+(n===g.v.length?'ok':'')+'">'+(n===g.v.length?tr('done'):tr('todo'))+'<span class="n">'+n+'/'+g.v.length+'</span></span>'+
        '<button type="button" class="btn ghost small" data-all="1"'+(n===g.v.length?' disabled':'')+'>'+tr('markAll')+'</button></div>';
      c.innerHTML=h;
      c.querySelectorAll('.tg').forEach(function(b){b.onclick=function(){var q=b.getAttribute('data-q');ST.q=ST.q===q?'':q;document.getElementById('q').value=ST.q;render();};});
      c.querySelectorAll('.var').forEach(function(b){
        b.onclick=function(){
          var i=parseInt(b.getAttribute('data-i'),10),k=owned.indexOf(i);
          if(k>-1){owned.splice(k,1);save();render();toast(nome(i)+tr('unmarked'));}
          else{owned.push(i);save();render(i);toast(tr('found')+nome(i)+'!');}
        };
      });
      c.querySelector('[data-all]').onclick=function(){
        var add=0;g.v.forEach(function(i){if(!has(i)){owned.push(i);add++;}});
        save();render();toast(gname(g)+': '+add+tr('marked'));
      };
      cards.appendChild(c);
    });
    sec.appendChild(cards);list.appendChild(sec);
  });
  if(!shown){var e=document.createElement('div');e.className='empty';e.textContent=tr('none');list.appendChild(e);}
  var t=owned.length;
  document.getElementById('count').textContent=t+'/'+TOTAL;
  document.getElementById('fill').style.width=(t/TOTAL*100)+'%';
  var bar=document.getElementById('bar');bar.setAttribute('aria-valuenow',t);bar.setAttribute('aria-valuemax',TOTAL);
}

function toast(t){
  var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200);
}
document.getElementById('import').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result),novos=0,last=null;
      (d.found||[]).forEach(function(n){
        n=parseInt(n,10);
        if(INFO[n-1]){last=n-1;if(!has(n-1)){owned.push(n-1);novos++;}}
      });
      if(INFO[d.last-1])last=d.last-1;
      if(last===null){toast(tr('noValid'));return;}
      save();render(novos?last:undefined);
      var el=document.getElementById('slot'+last);
      if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'});
      toast(novos?novos+tr('imported')+nome(last):tr('nothing'));
    }catch(err){toast(tr('readErr'));}
    e.target.value='';
  };
  r.readAsText(f);
};
document.getElementById('reset').onclick=function(){
  var b=this;
  if(b.getAttribute('data-sure')!=='1'){
    b.setAttribute('data-sure','1');b.textContent=tr('sure');
    b.style.color='var(--r-mitico)';b.style.borderColor='var(--r-mitico)';
    clearTimeout(b._t);b._t=setTimeout(function(){b.removeAttribute('data-sure');b.textContent=tr('reset');b.style.color='';b.style.borderColor='';},4000);
    return;
  }
  clearTimeout(b._t);b.removeAttribute('data-sure');b.textContent=tr('reset');b.style.color='';b.style.borderColor='';
  owned=[];save();render();toast(tr('resetDone')+TOTAL);
};
document.getElementById('code').onclick=function(){
  try{navigator.clipboard.writeText('DRAKONE').then(function(){toast(L==='en'?'Code DRAKONE copied!':'Código DRAKONE copiado!')},function(){})}catch(e){}
};
document.getElementById('perfil').onchange=function(){pfSwitch(this.value)};
document.getElementById('pfnew').onclick=function(){pfForm('new')};
document.getElementById('pfedit').onclick=function(){pfForm('edit')};
document.getElementById('pfok').onclick=pfSubmit;
document.getElementById('pfname').onkeydown=function(e){if(e.key==='Enter')pfSubmit();else if(e.key==='Escape')document.getElementById('pfform').hidden=true;};
document.getElementById('q').oninput=function(){ST.q=this.value.trim();render();};
document.getElementById('flt').onclick=function(){
  ST.status=(ST.status+1)%3;this.textContent=tr('filter')+tr('stat')[ST.status];
  this.classList.toggle('active',ST.status>0);render();
};
function setView(v){
  ST.view=v;
  [['vgrid','grid'],['vlist','list']].forEach(function(p){var b=document.getElementById(p[0]);b.classList.toggle('on',v===p[1]);b.setAttribute('aria-pressed',v===p[1]);});
  render();
}
document.getElementById('vgrid').onclick=function(){setView('grid')};
document.getElementById('vlist').onclick=function(){setView('list')};
function applyLang(){
  VN=TX[L].vn;document.documentElement.lang=L;document.title=tr('doc');
  var q=document.getElementById('q');q.placeholder=tr('search');q.setAttribute('aria-label',tr('search'));
  document.getElementById('vseg').setAttribute('aria-label',tr('view'));
  document.getElementById('vgrid').textContent=tr('grid');document.getElementById('vlist').textContent=tr('list');
  document.getElementById('flt').textContent=tr('filter')+tr('stat')[ST.status];
  document.getElementById('h1').textContent=tr('h1');
  document.getElementById('import').textContent=tr('imp');
  var rb=document.getElementById('reset');rb.textContent=tr('reset');rb.removeAttribute('data-sure');rb.style.color='';rb.style.borderColor='';
  document.getElementById('sync').title=tr('syncTitle');
  document.getElementById('pfok').textContent=tr('pfOk');document.getElementById('pfnew').title=tr('pfNew');document.getElementById('pfedit').title=tr('pfEdit');pfRender();
  document.getElementById('codel').textContent=L==='en'?'CODE IN THE SHOP':'CÓDIGO NA LOJA';
  document.getElementById('foot').textContent=L==='en'?'Click a slot to mark it as found. Progress is saved in this browser.':'Clica num espaço para o marcar como encontrado. O progresso fica guardado neste navegador.';
  setSync(SYNC.on);
  ['pt','en'].forEach(function(l){var b=document.getElementById('l'+l);b.classList.toggle('on',L===l);b.setAttribute('aria-pressed',L===l);});
  renderTabs();render();
}
function setLang(l){L=l;try{localStorage.setItem(LKEY,l)}catch(e){}applyLang();}
document.getElementById('lpt').onclick=function(){setLang('pt')};
document.getElementById('len').onclick=function(){setLang('en')};
applyLang();
poll();
</script>
