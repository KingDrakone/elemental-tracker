:root{--bg:#0f1b24;--ink:#efe2c4;--muted:#b8b0a0;--title:#f0c057;--card:#f2e6c9;--cink:#2a1c0f;--cmuted:#6b5a44;--line:#d8c59c;--track:#e4d3ad;--gold:#c9a24f;--brown:#7a4a1e;--hero:#fbecc4;--good:#3a9a5b;--warn:#a3361f;
--pirate:"Pirata One","Segoe UI",serif;--body:"Segoe UI",system-ui,-apple-system,sans-serif;--num:"Bahnschrift","DIN Condensed","Arial Narrow","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0;padding:22px 26px 28px;display:flex;flex-direction:column}
.pirate{font-family:var(--pirate);font-weight:400}
header.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
h1.app{margin:0;font-size:38px;line-height:1;color:var(--title)}
.sub{display:flex;gap:10px;align-items:center;margin-top:6px;color:var(--muted);font-size:13px}
.sel{font:600 14px var(--body);min-height:34px;border:1px solid var(--gold);border-radius:6px;background:var(--card);color:var(--cink);padding:4px 10px;max-width:220px}
.sync{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--cink);font-weight:600;font-size:14px}
.sync i{width:10px;height:10px;border-radius:50%;background:#c8412f;display:inline-block}
.sync.on i{background:var(--good)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 18px}
.tab{min-height:42px;padding:8px 20px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--ink);font:600 15px var(--body);cursor:pointer}
.tab:hover:not(.on){background:rgba(201,162,79,.16)}
.tab.on{background:var(--gold);color:var(--cink)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-right:2px}
.grid{display:grid;grid-template-columns:1.15fr 1fr 1.2fr 1fr 1fr;gap:12px}
@media (max-width:980px){.grid{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);color:var(--cink);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font:700 40px/1.05 var(--num);font-variation-settings:"wdth" 75;letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .n.sm{font-size:22px;line-height:1.2}
.stat .l{font-size:13px;color:var(--cmuted)}
.stat.hero{background:var(--brown);color:var(--hero);border:2px solid #e7b440}
.stat.hero .n{color:#ffd36a;font-size:58px}
.stat.hero .l{color:var(--hero)}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.28);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:#ffd36a;border-radius:4px;transition:width .5s}
.panel{background:var(--card);color:var(--cink);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel b{font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:600 14px var(--body);min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--gold);background:var(--card);color:var(--cink);cursor:pointer}
button.btn:hover{background:var(--track)}
button.btn.main{background:var(--brown);color:var(--hero);border-color:#e7b440}
button.btn.main:hover{background:#8b5626}
button.btn.danger{color:#8a2a1a}
.codebtn{font:600 13px var(--body);cursor:pointer;border:1px solid var(--gold);border-radius:999px;background:transparent;color:var(--ink);padding:6px 12px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.codebtn:hover{background:rgba(201,162,79,.18)}
.codebtn b{color:var(--title);font-weight:800;letter-spacing:.08em}
.hd2{font-weight:700;color:var(--title)}
h2.pirate{margin:6px 0 0;font-size:26px;color:var(--title);line-height:1}
.log{font:13px/1.6 Consolas,"Cascadia Mono",monospace;display:flex;flex-direction:column;gap:2px;min-height:44px}
.log .ok{color:#2c7a46}.log .erro{color:#a3361f}.log .t{color:var(--cmuted)}
.foot{margin-top:6px;padding-top:12px;border-top:1px dashed var(--gold);color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.set{display:flex;flex-direction:column;gap:10px}
.set .it{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);color:var(--cink);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.set .it .tx{min-width:0}
.set .it .nm{font-weight:700}
.set .it .ds{font-size:13px;color:var(--cmuted)}
.val{min-width:132px;text-align:center}
.val.on{background:var(--brown);color:var(--hero);border-color:#e7b440}
.val.off{background:var(--card)}
.hlp h3{margin:14px 0 4px;font:400 22px var(--pirate);color:var(--title)}
.hlp p{margin:2px 0;color:var(--ink)}
.hlp code{background:rgba(201,162,79,.18);padding:1px 6px;border-radius:4px}
iframe{flex:1;min-height:0;width:100%;border:1px solid var(--line);border-radius:8px;background:#0f1b24}
.off-msg{position:fixed;inset:0;background:rgba(15,27,36,.94);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}
.off-msg.on{display:flex}
.off-msg div{max-width:420px}
.off-msg h2{font:400 34px var(--pirate);color:var(--title);margin:0 0 8px}
button:focus-visible,.tab:focus-visible,.sel:focus-visible,a:focus-visible{outline:3px solid #ffd36a;outline-offset:2px}

$('perfil').onchange=function(){post({perfil:this.value})};

['twitch','M4 3h17v11l-4 4h-4l-3 3v-3H5V3zm15 10V5H6v11h4v2l2-2h4zm-4-6h2v5h-2zm-5 0h2v5h-2z','kingdrakone'],
['kick','M3 3h5v6l4-6h6l-5 8 5 10h-6l-4-7v7H3z','kingdrakone'],

function soc(){return '<div class="row">'+SOC.map(function(s){return '<button class="codebtn" data-a="'+s[0]+'"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="'+s[1]+'"/></svg><span class="hd2">'+s[2]+'</span></button>'}).join('')+'</div>'}
function inicio(){
 var s=S,x=T(),pc=s.total?Math.round(100*s.achados/s.total):0;
 var rar=s.rar.map(function(r){return esc(r.nome)+' '+r.n+'/'+r.t}).join(' · ');
 return '<div class="grid">'
 +'<div class="stat hero"><span class="l">'+x.hero+'</span><span class="n">'+s.achados+'/'+s.total+'</span><div class="bar"><i style="width:'+pc+'%"></i></div><span class="l">'+pc+'% · '+rar+'</span></div>'
 +'<div class="stat"><span class="n">♛ '+s.coroas+'</span><span class="l">'+x.crow+'</span></div>'
 +'<div class="stat"><span class="n sm">'+esc(s.ultimo||'—')+'</span><span class="l">'+x.last+'</span></div>'
 +'<div class="stat"><span class="n sm">'+(s.pagina?x.pgOn:x.pgOff)+'</span><span class="l">'+x.pg+'</span></div>'
 +'<div class="stat"><span class="n sm">'+esc(s.overlay)+'</span><span class="l">'+x.ov+'</span></div>'
 +'</div>'
 +'<div class="panel"><b>'+(s.rastreio?x.live:x.off)+'</b> · '+(s.rastreio?x.liveTx:x.offTx)+' · OBS: <code>'+esc(s.obs)+'</code></div>'
 +'<div class="row"><button class="btn main" data-a="pagina">'+x.bPag+'</button><button class="btn" data-a="visivel">'+(s.visivel?x.bHide:x.bShow)+'</button><button class="btn" data-a="bloqueio">'+(s.bloqueado?x.bUnl:x.bLock)+'</button><button class="btn" data-a="perfil">'+x.bProf+'</button><button class="btn" data-a="obs">'+x.bObs+'</button></div>'
 +soc()
 +'<h2 class="pirate">'+x.act+'</h2><div class="panel log">'+(s.registo.length?s.registo.slice().reverse().map(function(r){return '<div class="'+esc(r.tipo)+'">'+(r.tipo==='ok'?'✔ ':r.tipo==='erro'?'! ':'<span class="t">['+esc(r.h)+']</span> ')+esc(r.t)+'</div>'}).join(''):'<span class="t">'+x.nada+'</span>')+'</div>'
 +'<div class="foot"><span>'+(s.programa?x.footProg:x.footCon)+'</span><span class="row"><button class="btn danger" data-a="reset">'+x.reset+'</button><button class="btn danger" data-a="sair">'+x.quit+'</button></span></div>';
}
function colecao(){return S.pagina_existe?'<iframe id="pag" src="/pagina" title="Coleção"></iframe>':'<div class="panel">'+T().noPag+'</div>'}
function defs(){var x=T();return '<div class="set">'+S.definicoes.map(function(d){var on=/^(ativado|ligado|enabled|on)$/.test(d.valor),off=/^(desativado|desligado|disabled|off)$/.test(d.valor);
 return '<div class="it"><div class="tx"><div class="nm">'+esc(d.rotulo)+'</div><div class="ds">'+esc(d.desc)+'</div></div><button class="btn val '+(on?'on':off?'off':'')+'" data-d="'+esc(d.chave)+'">'+esc(d.valor||x.run)+'</button></div>'}).join('')+'</div>'}
function ajuda(){var h='';S.ajuda.forEach(function(l){if(!l.trim()){return}if(l.charAt(0)!==' '&&!/^\d\./.test(l)){h+='<h3>'+esc(l)+'</h3>'}else{h+='<p>'+esc(l.trim())+'</p>'}});return '<div class="hlp">'+h+'</div>'}
function draw(){
 if(!S)return;var h=[inicio,colecao,defs,ajuda][tab]();
 var chave=tab+'|'+(S.en?'en':'pt')+'|'+(tab===1?S.pagina_existe:h);if(ult.k===chave)return;ult.k=chave;
 var m=$('main'),y=m.scrollTop;m.innerHTML=h;m.scrollTop=y;
 var f=$('pag');if(f)f.onload=enviaIdioma;
}
function enviaIdioma(){var f=$('pag');if(f&&f.contentWindow&&S){try{f.contentWindow.postMessage({elementais:'idioma',v:S.en?'en':'pt'},'*')}catch(e){}}}
window.addEventListener('message',function(e){            /* a página (dentro da Coleção) mudou de idioma */
 var f=$('pag'),d=e.data;if(!f||e.source!==f.contentWindow||!d||d.elementais!=='idioma'||!S)return;
 if((d.v==='en')!==!!S.en&&(d.v==='en'||d.v==='pt'))post({idioma:d.v});
});
$('main').onclick=function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.a){var a=b.dataset.a;
  if(a==='reset'){if(!confirm(T().cReset))return;post({reset:true});return}
  if(a==='sair'){if(!confirm(T().cQuit))return;post({acao:'sair'});return}
  post({acao:a});}
 else if(b.dataset.d){post({definir:b.dataset.d})}
};
var langAnt=null;
function tick(){
 fetch('/painel/estado',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  falhas=0;$('off').classList.remove('on');S=d;var x=T(),l=d.en?'en':'pt';
  if(l!==langAnt){langAnt=l;document.documentElement.lang=l;tabsRender();document.querySelector('h1.app').textContent=x.titulo;$('perfil').setAttribute('aria-label',x.prof);$('off').innerHTML='<div><h2>'+x.closed+'</h2><p>'+x.closedTx+'</p></div>';enviaIdioma()}
  $('ver').textContent='v'+d.versao;$('codigo').innerHTML=x.code+'<b class="hd2">DRAKONE</b>';
  var sel=$('perfil'),k=d.perfis.map(function(p){return p.id+p.nome}).join('|')+d.perfil.id;
  if(sel.dataset.k!==k){sel.dataset.k=k;sel.innerHTML=d.perfis.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===d.perfil.id?' selected':'')+'>'+esc(p.nome)+'</option>'}).join('')}
  $('sync').classList.toggle('on',d.rastreio);$('synct').textContent=d.rastreio?x.wait:x.off;
  draw();
 }).catch(function(){falhas++;if(falhas>=4){$('off').classList.add('on');try{window.close()}catch(e){}}});
}
tabsRender();tick();setInterval(tick,1000);
</script></body></html>
